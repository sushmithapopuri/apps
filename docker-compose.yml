version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vms-backend
    ports:
      - "8000:8000"
    volumes:
      # - ./app/vms.db:/app/vms.db
      - ./app/storage/faces:/app/storage/faces
    environment:
      - DATABASE_URL=sqlite:////app/vms.db
      - VMS_DB_PATH=/app/vms.db
      - VMS_STORAGE_PATH=/app/storage/faces
      - WHATSAPP_API_URL=https://api.ultramsg.com/your_instance/messages/chat
      - WHATSAPP_API_KEY=your_token_here
    restart: on-failure:1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1  # Using Nginx proxy prefix
    container_name: vms-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: always
